<div class="flex flex-col items-center w-[400px] justify-center h-screen">
  <NeoCard class="card">
    <h1 class="text-center m-2 font-bold">Connectez-vous</h1>
    <form [formGroup]="loginForm" class="flex flex-col space-y-1">
      <NeoInput
        label="Email"
        helperText="Enter votre adresses email"
        type="text"
        name="identifer"
        placeholder="exemple@mail.com"
        formControlName="identifier"
        id="identifier"
        [required]="true"
      />
      <NeoDropdown
        [searchable]="true"
        (searchChange)="onSearch($event)"
        [label]="label2()"
      >
        <div dropdown-content>
          @for (category of filterItems(group2Items); track category.id) {
            <NeoDropdownItem
              (click)="selectCategory(category.id, categories, label2)"
              [item]="category.title"
            />
            <div class="neo-border-black neo-border-b-2"></div>
          }
        </div>
      </NeoDropdown>
      <NeoDropdown
        [multiSelect]="true"
        [searchable]="true"
        (searchChange)="onSearch($event)"
        [label]="label()"
      >
        <div dropdown-content>
          @for (category of filterItems(categories); track category.id) {
            <NeoDropdownItem
              (click)="selectCategory(category.id, categories, label)"
              [item]="category.title"
            />
            <div class="neo-border-black neo-border-b-2"></div>
          }
        </div>
      </NeoDropdown>

      <!--

            <p
              class="neo-px-4 neo-py-2 neo-border-b-2 neo-border-black hover:neo-bg-[#B8FF9F]"
            >
              {{ category.title }}
            </p>

      <NeoDropdown>
        <span dropdown-label>Sélectionner une catégorie</span>

        <div dropdown-content>
          @for (category of categories; track category.id) {
            <p
              class="neo-px-4 neo-py-2 neo-border-b-2 neo-border-black hover:neo-bg-[#B8FF9F]"
            >
              {{ category.title }}
            </p>
          }
        </div>
      </NeoDropdown>
      -->
      <NeoInput
        label="Mot de passe"
        helperText="Entrer votre mot de passe"
        [required]="true"
        formControlName="password"
        id="password"
        name="password"
        type="password"
        placeholder="P@$w0rd!"
      />
      <NeoButton id="loginBtn" type="submit" [disabled]="!loginForm.valid"
        >Se connecter</NeoButton
      >
    </form>
    <p class="mt-4 flex justify-center">
      <a
        routerLink="/auth/forgot-password"
        class="text-xxx-orange-400 underline"
        >Mot de passe oublié ?</a
      >
    </p>
  </NeoCard>
  <p class="mt-4">
    Pas encore de compte ?
    <a routerLink="/auth/signup" class="text-xxx-orange-400 underline"
      >Inscrivez-vous</a
    >
  </p>
</div>
