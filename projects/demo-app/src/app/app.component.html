<lib-neo-card width="medium">
    <NeoButton>Default</NeoButton>
    <NeoButton [properties]="{
    backgroundColor: 'red',
    roundedType:'medium'
}" [disabled]="true">red</NeoButton>
    <NeoButton [properties]="{
    backgroundColor: 'yellow',
    roundedType:'none'
}" width="md" roundedType="large" backgroundColor="orange" [disabled]="toDisable">orange</NeoButton>
    <NeoButton width="small" roundedType="large" backgroundColor="violet" [disabled]="toDisable">violet</NeoButton>
    <NeoButton width="small" roundedType="none" backgroundColor="yellow" [disabled]="toDisable">yellow</NeoButton>
</lib-neo-card>

<router-outlet />
