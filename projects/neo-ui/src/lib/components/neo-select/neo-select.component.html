<div class="neo-select">
  <button type="button" class="neo-select-button" (click)="toggleDropdown()">
    @if (selectedValues.length > 1) {
      {{ selectedValues[0].title }}
    } @else if (selectedValues.length == 1) {
      tototot {{ selectedValues[0].title }}
    } @else {
      {{ placeholder }}
    }
  </button>

  @if (isOpen) {
    <div class="neo-select-dropdown">
      @for (option of options; track option.id) {
        <div
          (click)="selectOption(option)"
          [class.selected]="selectedValues.includes(option)"
        >
          {{ option.title }}
        </div>
      }
    </div>
  }
</div>
